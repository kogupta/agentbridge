name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version, Build and Release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.7.1'
          cache-disabled: true

      - name: Determine version
        id: version
        shell: bash
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          current=${latest#v}
          if [ -z "$current" ] || [ "$current" = "$latest" ]; then current=0.0.0; fi
          IFS=. read -r major minor patch <<< "$current"
          commits=$(git log --pretty=format:%s "${latest:-HEAD}")
          if [ -z "$commits" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$commits" | grep -qE '^feat(\(.+\))?:'; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          version="$major.$minor.$patch"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        if: steps.version.outputs.skip != 'true'
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: gradle :plugin-core:buildPlugin --no-daemon --quiet

      - name: Generate release notes
        if: steps.version.outputs.skip != 'true'
        run: bash scripts/generate-changelog.sh > release-notes.md

      - name: Attest plugin
        if: steps.version.outputs.skip != 'true'
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: plugin-core/build/distributions/*.zip

      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "Release ${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md \
            plugin-core/build/distributions/*.zip
